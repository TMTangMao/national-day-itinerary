<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>出游攻略</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-qingke-huangyou@5.2.5/index.css">
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #1c1c1c;
      background: #fff;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px 28px 4px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }
    .meta { color: #8a8f98; font-size: 13px; letter-spacing: 0.08em; }
    .trips {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 28px 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    a.trip {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      height: auto;
      min-height: 0;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      background: #d8dde3;
    }
    a.trip img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease;
    }
    a.trip:hover img { transform: scale(1.04); }
    a.trip strong {
      position: relative;
      z-index: 1;
      font-family: "ZCOOL QingKe HuangYou", "Microsoft YaHei", sans-serif;
      font-size: clamp(52px, 6.4vw, 92px);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
    }
    .jd strong { color: #1f4fad; }
    .sx strong { color: #ff3b30; }
    @media (max-width: 760px) {
      header, .trips { padding-left: 16px; padding-right: 16px; }
      .trips { grid-template-columns: 1fr; }
      a.trip strong { font-size: 56px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>出游攻略</h1>
    <span class="meta">2026 · 从武汉出发</span>
  </header>
  <main class="trips">
    <a class="trip jd" href="景德镇.html">
      <img alt="" src="https://tr-osdcp.qunarzz.com/tr-osd-tr-space/img/ef98ecc9c6a7d19947f8094f7decfb53.jpg">
      <strong>景德镇</strong>
    </a>
    <a class="trip sx" href="行程计划.html">
      <img alt="" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Yangtze_river_three_gorges.jpg/960px-Yangtze_river_three_gorges.jpg">
      <strong>三峡环线</strong>
    </a>
  </main>
</body>
</html>
